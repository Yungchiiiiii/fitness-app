<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#fbfbfc"/>
      <stop offset="1" stop-color="#e8e9ec"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.72" stop-color="#a9abb1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#777a82" stop-opacity="0.42"/>
    </linearGradient>
    <radialGradient id="glow" cx="26%" cy="18%" r="78%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="artDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#4c4d52" flood-opacity="0.18"/>
    </filter>
    <filter id="invertArtwork" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="table" tableValues="1 0"/>
        <feFuncG type="table" tableValues="1 0"/>
        <feFuncB type="table" tableValues="1 0"/>
      </feComponentTransfer>
    </filter>
    <mask id="artworkMask" mask-type="luminance">
      <rect width="1024" height="1024" fill="black"/>
      <image xlink:href="fitness-logo.png" x="106" y="106" width="812" height="812"
        preserveAspectRatio="xMidYMid meet" filter="url(#invertArtwork)"/>
    </mask>
    <clipPath id="safeArea">
      <rect x="20" y="20" width="984" height="984" rx="210"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#surface)"/>
  <g clip-path="url(#safeArea)">
    <rect x="20" y="20" width="984" height="984" rx="210" fill="url(#glow)"/>
    <rect width="1024" height="1024" fill="#101114" mask="url(#artworkMask)" filter="url(#artDepth)"/>
  </g>
  <rect x="14" y="14" width="996" height="996" rx="218" fill="none" stroke="url(#bevel)" stroke-width="20"/>
  <rect x="35" y="35" width="954" height="954" rx="195" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="5"/>
  <path d="M109 71 C280 13 744 13 915 71" fill="none" stroke="#ffffff" stroke-opacity="0.86" stroke-width="10" stroke-linecap="round"/>
</svg>
